name: Dragon Queen LFS bridge

on:
  push:
    branches:
      - feature/dragon-queen-intake
    paths:
      - .github/workflows/dragon-queen-lfs-bridge.yml

permissions:
  contents: write

jobs:
  upload-approved-sovereign-wyrm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pointer commit
        uses: actions/checkout@v4
        with:
          ref: feature/dragon-queen-intake
          lfs: false

      - name: Install Git LFS
        run: |
          git lfs install --local
          git lfs version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned builder dependencies
        run: python -m pip install numpy==2.3.5 matplotlib==3.10.8

      - name: Regenerate approved Sovereign Wyrm files
        env:
          SOVEREIGN_WYRM_SKIP_PREVIEW: "1"
        run: |
          SOVEREIGN_WYRM_LOD=LOD0 SOVEREIGN_WYRM_OUT=public/assets/characters/aa-06/kart.glb python tools/assets/build_dragon_queen_sovereign_wyrm.py
          SOVEREIGN_WYRM_LOD=LOD1 SOVEREIGN_WYRM_OUT=public/assets/characters/aa-06/kart-lod1.glb python tools/assets/build_dragon_queen_sovereign_wyrm.py
          SOVEREIGN_WYRM_LOD=LOD2 SOVEREIGN_WYRM_OUT=public/assets/characters/aa-06/kart-lod2.glb python tools/assets/build_dragon_queen_sovereign_wyrm.py

      - name: Verify approved object IDs and unchanged pointers
        run: |
          sha256sum -c <<'HASHES'
          57b3f4b248ed96cd19b0c2b233aec4462fde73b102ad9acde8941550bf69e305  public/assets/characters/aa-06/kart.glb
          31bdd684fb764fdb4d6e04726971e0bf3f34ee4f36aefbf652fcdf3b133053c3  public/assets/characters/aa-06/kart-lod1.glb
          124ec43e1ada192d67a3d4fe6bb6c3ec1cdd3f9df6b6c22b1af05b25762197de  public/assets/characters/aa-06/kart-lod2.glb
          HASHES
          git add -- public/assets/characters/aa-06/kart.glb public/assets/characters/aa-06/kart-lod1.glb public/assets/characters/aa-06/kart-lod2.glb
          git diff --cached --exit-code

      - name: Upload only approved LFS objects
        run: |
          git lfs push --object-id origin \
            57b3f4b248ed96cd19b0c2b233aec4462fde73b102ad9acde8941550bf69e305 \
            31bdd684fb764fdb4d6e04726971e0bf3f34ee4f36aefbf652fcdf3b133053c3 \
            124ec43e1ada192d67a3d4fe6bb6c3ec1cdd3f9df6b6c22b1af05b25762197de

      - name: Fetch back and verify
        run: |
          rm -rf .git/lfs/objects
          git lfs fetch origin feature/dragon-queen-intake
          git lfs checkout -- public/assets/characters/aa-06/kart.glb public/assets/characters/aa-06/kart-lod1.glb public/assets/characters/aa-06/kart-lod2.glb
          git lfs fsck
          sha256sum -c <<'HASHES'
          57b3f4b248ed96cd19b0c2b233aec4462fde73b102ad9acde8941550bf69e305  public/assets/characters/aa-06/kart.glb
          31bdd684fb764fdb4d6e04726971e0bf3f34ee4f36aefbf652fcdf3b133053c3  public/assets/characters/aa-06/kart-lod1.glb
          124ec43e1ada192d67a3d4fe6bb6c3ec1cdd3f9df6b6c22b1af05b25762197de  public/assets/characters/aa-06/kart-lod2.glb
          HASHES
