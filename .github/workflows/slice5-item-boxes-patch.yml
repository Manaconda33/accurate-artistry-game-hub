name: Patch Slice 5 item box integration

on:
  push:
    branches:
      - feature/slice-5-item-boxes
    paths:
      - tools/slice5_item_boxes_patch.py
      - .github/workflows/slice5-item-boxes-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/slice-5-item-boxes
          fetch-depth: 0

      - name: Patch race integration
        run: python tools/slice5_item_boxes_patch.py

      - name: Remove one-shot tooling and commit
        shell: bash
        run: |
          rm tools/slice5_item_boxes_patch.py .github/workflows/slice5-item-boxes-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Integrate visible Slice 5 item boxes into race'
          git push origin HEAD:feature/slice-5-item-boxes
