name: Temporary LFS materialization - Lavi Potato

on:
  push:
    branches:
      - agent/lavi-potato-kart

permissions:
  contents: write

concurrency:
  group: lfs-materialize-lavi-potato
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLCONFIGDIR: /tmp/matplotlib
    steps:
      - name: Check out LFS pointers
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic builder dependencies
        run: python -m pip install "numpy==2.3.5" "matplotlib==3.10.8"

      - name: Rebuild approved Potato models
        run: |
          POTATO_LOD=LOD0 POTATO_OUT=public/assets/characters/aa-02/kart.glb POTATO_SKIP_PREVIEW=1 python tools/assets/build_lavi_potato.py
          POTATO_LOD=LOD1 POTATO_OUT=public/assets/characters/aa-02/kart-lod1.glb POTATO_SKIP_PREVIEW=1 python tools/assets/build_lavi_potato.py
          POTATO_LOD=LOD2 POTATO_OUT=public/assets/characters/aa-02/kart-lod2.glb POTATO_SKIP_PREVIEW=1 python tools/assets/build_lavi_potato.py

      - name: Verify approved object IDs
        run: |
          printf '%s  %s\n' \
            '5d3d570e21759d0f77f2bc7cf88085e43b1b8c1be75a3ef0299f8fac83ef0ad2' \
            'public/assets/characters/aa-02/kart.glb' \
            'f74cc0e67de68d5b1f06a21dd3b9436521dfa0e7027f94ee9315ab6f107335ce' \
            'public/assets/characters/aa-02/kart-lod1.glb' \
            'e1df4c501328d2709fb6793269e6a48a930bf7a7ce75eb0b6152765c46d0e758' \
            'public/assets/characters/aa-02/kart-lod2.glb' | sha256sum --check --strict

      - name: Populate and validate the local LFS store
        run: |
          git lfs install --local
          git add -- public/assets/characters/aa-02/kart.glb \
            public/assets/characters/aa-02/kart-lod1.glb \
            public/assets/characters/aa-02/kart-lod2.glb
          git diff --cached --exit-code -- \
            public/assets/characters/aa-02/kart.glb \
            public/assets/characters/aa-02/kart-lod1.glb \
            public/assets/characters/aa-02/kart-lod2.glb
          git lfs fsck

      - name: Upload approved LFS objects
        run: |
          git lfs push --object-id origin \
            5d3d570e21759d0f77f2bc7cf88085e43b1b8c1be75a3ef0299f8fac83ef0ad2 \
            f74cc0e67de68d5b1f06a21dd3b9436521dfa0e7027f94ee9315ab6f107335ce \
            e1df4c501328d2709fb6793269e6a48a930bf7a7ce75eb0b6152765c46d0e758

      - name: Fetch uploaded objects from GitHub
        run: |
          find .git/lfs/objects -type f -delete
          git lfs fetch origin "$GITHUB_SHA"
          git lfs fsck
