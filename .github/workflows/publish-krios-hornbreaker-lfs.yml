name: Publish Krios Hornbreaker LFS objects

on:
  workflow_dispatch:
  push:
    branches: [feature/krios-hornbreaker-3d]
    paths:
      - .github/workflows/publish-krios-hornbreaker-lfs.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.1.3 matplotlib==3.9.2
      - name: Rebuild approved assets
        env:
          HORNBREAKER_SKIP_PREVIEW: '1'
        run: |
          HORNBREAKER_OUT=public/assets/characters/aa-10/kart.glb python tools/assets/build_krios_hornbreaker.py
          HORNBREAKER_LOD=LOD1 HORNBREAKER_OUT=public/assets/characters/aa-10/kart-lod1.glb python tools/assets/build_krios_hornbreaker.py
          HORNBREAKER_LOD=LOD2 HORNBREAKER_OUT=public/assets/characters/aa-10/kart-lod2.glb python tools/assets/build_krios_hornbreaker.py
      - name: Verify approved hashes
        run: |
          printf '%s  %s\n' \
            '906cdddd34e8b4270e9c99d334639f2bf7a372cceb22abbb1edaaf15ad8c38a9' 'public/assets/characters/aa-10/kart.glb' \
            '986f6c355401d45ae7ff85f13391de48f3db6d2b5b2b47ed10f5ced7708061f0' 'public/assets/characters/aa-10/kart-lod1.glb' \
            '62a3993c11b4c38eebe0d73f7a9b713fcdb1467578ea5429b188ea40e164fa76' 'public/assets/characters/aa-10/kart-lod2.glb' | sha256sum --check --strict
      - name: Verify committed pointers and upload only approved objects
        run: |
          git lfs install --local
          git add public/assets/characters/aa-10/kart.glb public/assets/characters/aa-10/kart-lod1.glb public/assets/characters/aa-10/kart-lod2.glb
          git diff --cached --exit-code
          git lfs push origin \
            --object-id 906cdddd34e8b4270e9c99d334639f2bf7a372cceb22abbb1edaaf15ad8c38a9 \
            986f6c355401d45ae7ff85f13391de48f3db6d2b5b2b47ed10f5ced7708061f0 \
            62a3993c11b4c38eebe0d73f7a9b713fcdb1467578ea5429b188ea40e164fa76
      - name: Fetch-back integrity check
        run: |
          rm -rf .git/lfs/objects
          git lfs fetch origin feature/krios-hornbreaker-3d
          git lfs fsck
