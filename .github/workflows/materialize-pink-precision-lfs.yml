name: Materialize approved Pink Precision LFS objects

on:
  push:
    branches:
      - agent/accu-pink-precision
    paths:
      - .github/workflows/materialize-pink-precision-lfs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          ref: agent/accu-pink-precision
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned builder dependencies
        run: python -m pip install numpy==2.3.5 matplotlib==3.10.8
      - name: Rebuild approved Pink Precision models
        env:
          MPLBACKEND: Agg
        run: |
          PINK_PRECISION_LOD=0 PINK_PRECISION_OUT=public/assets/characters/aa-11/kart.glb PINK_PRECISION_SKIP_PREVIEW=1 python tools/assets/build_accu_pink_precision.py
          PINK_PRECISION_LOD=1 PINK_PRECISION_OUT=public/assets/characters/aa-11/kart-lod1.glb PINK_PRECISION_SKIP_PREVIEW=1 python tools/assets/build_accu_pink_precision.py
          PINK_PRECISION_LOD=2 PINK_PRECISION_OUT=public/assets/characters/aa-11/kart-lod2.glb PINK_PRECISION_SKIP_PREVIEW=1 python tools/assets/build_accu_pink_precision.py
      - name: Verify approved object IDs and pointer stability
        run: |
          echo "6e3f8cb6d1bdee7f5b315a7c154bd45fd0f4d6ac9b2e6445b9d85d81959ff958  public/assets/characters/aa-11/kart.glb" | sha256sum -c -
          echo "9f481cf854d47ec330e5909d5003353376c471cd37562d79410c20e3f824f9c7  public/assets/characters/aa-11/kart-lod1.glb" | sha256sum -c -
          echo "792b8f8bf1d359b3ae464003f0fa9432de5c391d8bd18ac8f84535593d9ba820  public/assets/characters/aa-11/kart-lod2.glb" | sha256sum -c -
          git add -- public/assets/characters/aa-11/kart.glb public/assets/characters/aa-11/kart-lod1.glb public/assets/characters/aa-11/kart-lod2.glb
          git diff --cached --exit-code
      - name: Upload only approved LFS objects
        run: |
          git lfs push origin --object-id 6e3f8cb6d1bdee7f5b315a7c154bd45fd0f4d6ac9b2e6445b9d85d81959ff958
          git lfs push origin --object-id 9f481cf854d47ec330e5909d5003353376c471cd37562d79410c20e3f824f9c7
          git lfs push origin --object-id 792b8f8bf1d359b3ae464003f0fa9432de5c391d8bd18ac8f84535593d9ba820
      - name: Fetch back and verify
        run: |
          rm -rf .git/lfs/objects
          git lfs fetch origin agent/accu-pink-precision
          git lfs fsck
