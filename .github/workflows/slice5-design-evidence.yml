name: Record Slice 5 design checkpoint evidence

on:
  push:
    branches:
      - docs/slice-5-design-evidence
    paths:
      - .github/workflows/slice5-design-evidence.yml

permissions:
  contents: write

jobs:
  record:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/slice-5-design-evidence
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record merged checkpoint evidence
        run: python tools/record_slice5_design_evidence.py

      - name: Commit evidence and remove one-shot tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Record Slice 5 design checkpoint evidence'
          git push origin HEAD:docs/slice-5-design-evidence
