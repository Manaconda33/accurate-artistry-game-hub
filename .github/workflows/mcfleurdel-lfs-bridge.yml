name: McFleurdel LFS publication bridge

on:
  push:
    branches:
      - agent/mcfleurdel-production
    paths:
      - .github/workflows/mcfleurdel-lfs-bridge.yml

permissions:
  contents: write

jobs:
  publish-approved-mcfleurdel-glbs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pointer commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Install pinned builder dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python packages
        run: python -m pip install numpy==2.3.5 matplotlib==3.10.8

      - name: Rebuild approved GLBs
        env:
          FLEUR_DE_NUIT_SKIP_PREVIEW: '1'
        run: |
          FLEUR_DE_NUIT_LOD=LOD0 FLEUR_DE_NUIT_OUT=public/assets/characters/aa-07/kart.glb python tools/assets/build_mcfleurdel_fleur_de_nuit.py
          FLEUR_DE_NUIT_LOD=LOD1 FLEUR_DE_NUIT_OUT=public/assets/characters/aa-07/kart-lod1.glb python tools/assets/build_mcfleurdel_fleur_de_nuit.py
          FLEUR_DE_NUIT_LOD=LOD2 FLEUR_DE_NUIT_OUT=public/assets/characters/aa-07/kart-lod2.glb python tools/assets/build_mcfleurdel_fleur_de_nuit.py

      - name: Require approved object IDs
        run: |
          test "$(sha256sum public/assets/characters/aa-07/kart.glb | cut -d' ' -f1)" = "5d7e0941b90ac5d13bb4e019ec43f22a5f9e841c89abaf568ab0c226d8cc92c0"
          test "$(sha256sum public/assets/characters/aa-07/kart-lod1.glb | cut -d' ' -f1)" = "8169b05da4a66894d76904f7193c845755bf8d556d01805cc16e8cd870d9a939"
          test "$(sha256sum public/assets/characters/aa-07/kart-lod2.glb | cut -d' ' -f1)" = "d862fdb489419d96917b1df3ee7f7eab56796b7aa3be7906be3abab67c03d77f"

      - name: Prove committed pointers are unchanged
        run: |
          git add public/assets/characters/aa-07/kart.glb public/assets/characters/aa-07/kart-lod1.glb public/assets/characters/aa-07/kart-lod2.glb
          git diff --cached --exit-code

      - name: Upload only approved LFS objects
        run: |
          git lfs push --object-id origin 5d7e0941b90ac5d13bb4e019ec43f22a5f9e841c89abaf568ab0c226d8cc92c0 8169b05da4a66894d76904f7193c845755bf8d556d01805cc16e8cd870d9a939 d862fdb489419d96917b1df3ee7f7eab56796b7aa3be7906be3abab67c03d77f

      - name: Fetch back and verify
        run: |
          rm -rf .git/lfs/objects
          git lfs fetch origin agent/mcfleurdel-production
          git lfs fsck
