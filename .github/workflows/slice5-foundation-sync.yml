name: Sync Slice 5 foundation records

on:
  push:
    branches:
      - feature/slice-5-items-foundation
    paths:
      - tools/slice5_foundation_sync.py
      - .github/workflows/slice5-foundation-sync.yml

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/slice-5-items-foundation
          fetch-depth: 0

      - name: Patch governed records
        run: python tools/slice5_foundation_sync.py

      - name: Remove one-shot tooling and commit
        shell: bash
        run: |
          rm tools/slice5_foundation_sync.py .github/workflows/slice5-foundation-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Record Slice 5 foundation implementation checkpoint'
          git push origin HEAD:feature/slice-5-items-foundation
