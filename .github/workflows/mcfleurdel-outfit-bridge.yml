name: McFleurdel Outfit Bridge

on:
  push:
    branches:
      - art/mcfleurdel-checkerboard-outfit
    paths:
      - tools/build-mcfleurdel-outfit-batch2.py
      - .github/workflows/mcfleurdel-outfit-bridge.yml

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: art/mcfleurdel-checkerboard-outfit
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow==11.3.0 numpy==2.3.2

      - name: Build Batch 2 outfit candidates
        run: python tools/build-mcfleurdel-outfit-batch2.py

      - name: Verify candidate dimensions and alpha
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          expected = [
              Path('public/assets/characters/aa-07/driver/front-victory.png'),
              Path('public/assets/characters/aa-07/driver/rear.png'),
              Path('public/assets/characters/aa-07/driver/steer-left.png'),
              Path('public/assets/characters/aa-07/driver/steer-right.png'),
              Path('public/assets/characters/aa-07/driver/hit.png'),
              Path('public/assets/characters/aa-07/driver/victory.png'),
          ]
          for path in expected:
              im = Image.open(path).convert('RGBA')
              assert im.size == (512, 512), (path, im.size)
              lo, hi = im.getchannel('A').getextrema()
              assert lo == 0 and hi == 255, (path, (lo, hi))
              assert all(im.getpixel(p)[3] == 0 for p in [(0,0),(511,0),(0,511),(511,511)])
              print(path, im.size, 'alpha', (lo, hi))
          PY

      - name: Commit Batch 2 candidates
        run: |
          git config user.name 'Manaconda33'
          git config user.email 'manny.a.martinez33@gmail.com'
          git add \
            public/assets/characters/aa-07/driver/front-victory.png \
            public/assets/characters/aa-07/driver/rear.png \
            public/assets/characters/aa-07/driver/steer-left.png \
            public/assets/characters/aa-07/driver/steer-right.png \
            public/assets/characters/aa-07/driver/hit.png \
            public/assets/characters/aa-07/driver/victory.png
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Generate McFleurdel checkerboard outfit Batch 2 [outfit-generated]'
          git push origin HEAD:art/mcfleurdel-checkerboard-outfit
