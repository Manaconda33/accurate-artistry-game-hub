name: Temporary Toph LFS publication

on:
  push:
    branches: [agent/toph-production]
    paths:
      - 'public/assets/characters/aa-08/*.glb'
      - 'tools/assets/build_toph_grave_shift.py'
      - '.github/workflows/toph-candidate.yml'

permissions:
  contents: write

jobs:
  publish-approved-objects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 matplotlib==3.10.5
      - name: Rebuild and verify locked objects
        run: |
          GRAVE_SHIFT_LOD=LOD0 GRAVE_SHIFT_OUT=public/assets/characters/aa-08/kart.glb GRAVE_SHIFT_SKIP_PREVIEW=1 python tools/assets/build_toph_grave_shift.py
          GRAVE_SHIFT_LOD=LOD1 GRAVE_SHIFT_OUT=public/assets/characters/aa-08/kart-lod1.glb GRAVE_SHIFT_SKIP_PREVIEW=1 python tools/assets/build_toph_grave_shift.py
          GRAVE_SHIFT_LOD=LOD2 GRAVE_SHIFT_OUT=public/assets/characters/aa-08/kart-lod2.glb GRAVE_SHIFT_SKIP_PREVIEW=1 python tools/assets/build_toph_grave_shift.py
          echo "87db250bcacbbbe93afdee0e4a346ff3c5aaca7fbb90668af383b1772154c953  public/assets/characters/aa-08/kart.glb" | sha256sum -c -
          echo "1d3b62f715e6288b01447eafe2a81a07b09fe676019b1849ff3b5b78ad9c4d23  public/assets/characters/aa-08/kart-lod1.glb" | sha256sum -c -
          echo "2c38dd14a334443fff3f872fc618210642f51dfc8b612bf1f075b347a5a65be7  public/assets/characters/aa-08/kart-lod2.glb" | sha256sum -c -
          git lfs install --local
          git add public/assets/characters/aa-08/kart.glb public/assets/characters/aa-08/kart-lod1.glb public/assets/characters/aa-08/kart-lod2.glb
          git diff --cached --exit-code
      - name: Publish only approved LFS object IDs
        run: |
          git lfs push --object-id origin 87db250bcacbbbe93afdee0e4a346ff3c5aaca7fbb90668af383b1772154c953 1d3b62f715e6288b01447eafe2a81a07b09fe676019b1849ff3b5b78ad9c4d23 2c38dd14a334443fff3f872fc618210642f51dfc8b612bf1f075b347a5a65be7
          rm -rf .git/lfs/objects
          git lfs fetch origin agent/toph-production
          git lfs fsck
